[project]
name = "credit-card-fraud-detection"
version = "0.1.0"
description = "An end-to-end credit card fraud detection system using statistical analysis and machine learning."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

